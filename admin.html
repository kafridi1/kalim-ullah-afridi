
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Kalimullah</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .dashboard { max-width: 950px; margin: 45px auto; padding: 20px; }
    .admin-panel { background: var(--card); padding: 25px; border: 1px solid var(--border); border-radius: 14px; margin: 20px 0; }
    .admin-panel h2 { margin-bottom: 18px; }
    .admin-form { display: grid; gap: 14px; }
    .admin-form select { padding: 13px; background: var(--bg); color: white; border: 1px solid var(--border); border-radius: 8px; }
    .item-row { padding: 15px 0; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; gap: 15px; align-items: center; }
    .item-row p { color: var(--muted); font-size: 13px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .small-btn { padding: 7px 12px; border-radius: 6px; border: 1px solid var(--blue); background: transparent; color: white; cursor: pointer; }
    .danger { border-color: #ed6262; }
    .hidden { display: none; }
    .notice { color: var(--muted); font-size: 13px; margin-top: 12px; }
  </style>
</head>
<body>

<header class="navbar">
  <a class="logo" href="index.html">KA<span>.</span></a>
  <a href="index.html" class="admin-link">View Website</a>
</header>

<main class="dashboard">
  <p class="eyebrow">WEBSITE MANAGEMENT</p>
  <h1>Admin Dashboard</h1>

  <section id="loginPanel" class="admin-panel">
    <h2>Admin Login</h2>
    <form id="loginForm" class="admin-form">
      <input id="password" type="password" placeholder="Demo password" required>
      <button class="btn primary">Login</button>
    </form>
    <p class="notice">Demo password: admin123. This is not secure authentication.</p>
  </section>

  <div id="dashboardContent" class="hidden">

    <section class="admin-panel">
      <h2 id="formHeading">Add New Post or Project</h2>
      <form id="itemForm" class="admin-form">
        <input id="itemTitle" placeholder="Title" required>
        <textarea id="itemDescription" placeholder="Description" required></textarea>

        <select id="itemType">
          <option value="posts">Blog Post</option>
          <option value="projects">Project</option>
        </select>

        <select id="itemStatus">
          <option value="published">Publish</option>
          <option value="draft">Save as Draft</option>
        </select>

        <label>Upload image (optional)</label>
        <input id="itemImage" type="file" accept="image/*">

        <button class="btn primary" type="submit">Save Item</button>
        <button class="small-btn hidden" type="button" id="cancelEdit">Cancel Edit</button>
      </form>
      <p class="notice">Images are saved in this browser. Large images may exceed browser storage limits.</p>
    </section>

    <section class="admin-panel">
      <h2>Manage Content</h2>
      <div id="manageList"></div>
    </section>

    <button id="logoutBtn" class="btn secondary">Logout</button>
  </div>
</main>

<script src="admin.js"></script>
</body>
</html>
