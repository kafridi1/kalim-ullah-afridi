
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kalim Social</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <header class="topbar">
    <h1>Kalim Social</h1>
    <span>Connect with everyone</span>
  </header>

  <main class="container">
    <p id="message" role="status"></p>

    <section id="auth-section" class="panel">
      <h2>Welcome to Kalim Social</h2>
      <div class="auth-grid">
        <form id="signup-form">
          <h3>Create account</h3>
          <input id="signup-name" placeholder="Full name" required maxlength="60">
          <input id="signup-email" type="email" placeholder="Email" required>
          <input id="signup-password" type="password" placeholder="Password (minimum 6 characters)" minlength="6" required>
          <button type="submit">Sign Up</button>
        </form>

        <form id="login-form">
          <h3>Login</h3>
          <input id="login-email" type="email" placeholder="Email" required>
          <input id="login-password" type="password" placeholder="Password" required>
          <button type="submit">Login</button>
        </form>
      </div>
    </section>

    <section id="home-section" hidden>
      <nav class="nav">
        <button data-tab="feed">Home</button>
        <button data-tab="profile">My Profile</button>
        <button data-tab="search">Search</button>
        <button data-tab="notifications">Notifications</button>
        <button id="logout-button" class="danger">Logout</button>
      </nav>

      <section id="feed-view" class="view">
        <form id="post-form" class="panel">
          <h2>Create a post</h2>
          <textarea id="post-content" placeholder="What's on your mind?" maxlength="2000"></textarea>
          <label for="post-image">Choose an image (optional)</label>
          <input id="post-image" type="file" accept="image/*">
          <button type="submit">Publish Post</button>
        </form>
        <h2>Latest Posts</h2>
        <div id="feed"></div>
      </section>

      <section id="profile-view" class="view" hidden>
        <div class="panel">
          <h2>My Profile</h2>
          <div id="my-profile"></div>
          <form id="profile-form">
            <input id="profile-name" placeholder="Full name" maxlength="60">
            <input id="profile-username" placeholder="Username" maxlength="30">
            <textarea id="profile-bio" placeholder="Your bio" maxlength="250"></textarea>
            <label for="avatar-file">Profile picture</label>
            <input id="avatar-file" type="file" accept="image/*">
            <button type="submit">Save Profile</button>
          </form>
        </div>
      </section>

      <section id="search-view" class="view" hidden>
        <div class="panel">
          <h2>Find people</h2>
          <input id="search-input" placeholder="Search by name or username">
          <button id="search-button" type="button">Search</button>
          <div id="search-results"></div>
        </div>
      </section>

      <section id="notifications-view" class="view" hidden>
        <div class="panel">
          <h2>Notifications</h2>
          <div id="notifications-list"></div>
        </div>
      </section>

      <section id="other-profile-view" class="view" hidden>
        <div class="panel">
          <button id="back-button" type="button">← Back</button>
          <div id="other-profile"></div>
          <h3>Posts</h3>
          <div id="other-posts"></div>
        </div>
      </section>
    </section>
  </main>

  <footer>
    <p>© 2026 Kalim Social</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
